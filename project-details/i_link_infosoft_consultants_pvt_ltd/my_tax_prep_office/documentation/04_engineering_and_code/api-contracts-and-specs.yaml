openapi: 3.0.3
info:
  title: Tax Document Extraction API
  version: 1.0.0
  description: >
    Confidence-scored tax document extraction and eligibility classification.
    The system never auto-commits low-confidence fields; they route to a human review queue.
servers:
  - url: https://api.mytaxprepoffice.com/v1

security:
  - sessionCookie: []

paths:
  /documents:
    post:
      summary: Upload and extract a tax document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                doc_type_hint: { type: string }
      responses:
        '200':
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResult'
        '422':
          description: Unprocessable document (e.g., unreadable scan)

  /documents/{document_id}/fields:
    get:
      summary: Get extracted fields with confidence
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Field'

  /reviews:
    post:
      summary: Submit a reviewer action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAction'
      responses:
        '200':
          description: Action recorded

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mtpo.sid

  schemas:
    ExtractionResult:
      type: object
      properties:
        document_id: { type: string }
        doc_type: { type: string }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        review_required: { type: boolean }

    Field:
      type: object
      properties:
        field_id: { type: string }
        field_name: { type: string }
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        ocr_token_confidence: { type: number, minimum: 0, maximum: 1 }
        provenance: { type: object }
        status: { type: string, enum: [auto_filled, pending_review, accepted, corrected] }

    ReviewAction:
      type: object
      required: [field_id, action]
      properties:
        field_id: { type: string }
        action: { type: string, enum: [accept, correct, reject_document] }
        corrected_value: { type: string }