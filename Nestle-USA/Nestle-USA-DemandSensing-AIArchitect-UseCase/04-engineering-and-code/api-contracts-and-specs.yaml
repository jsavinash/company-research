openapi: 3.0.3
info:
  title: Demand Sensing & Scenario Copilot API
  version: 1.0.0
  description: >
    API for the Agentic GLP-1 Demand Sensing & Scenario Copilot. All endpoints require
    Entra ID authentication and are subject to OPA/ABAC authorization. All LLM-backed
    endpoints go through the AI gateway (rate limit, cache, chargeback).
servers:
  - url: https://api.nestle-demand-sensing.internal/v1

security:
  - bearerAuth: []

paths:
  /forecasts:
    post:
      summary: Run a regime-aware forecast
      description: >
        Produces calibrated, hierarchically-reconciled forecasts with P10/P50/P90.
        The LLM is never used to produce numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequest'
      responses:
        '200':
          description: Forecast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResult'
        '403':
          description: Not permitted for this banner/DMA (OPA)

  /scenarios:
    post:
      summary: Run a scenario what-if (conversational)
      description: >
        Natural-language scenario (e.g., "GLP-1 +5pp in Southeast"). Orchestrates
        Attribution + Forecast agents and returns a narrated, grounded result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
      responses:
        '200':
          description: Scenario result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResult'

  /attribution:
    post:
      summary: Causal attribution of a demand delta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionRequest'
      responses:
        '200':
          description: Attribution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionResult'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ForecastRequest:
      type: object
      required: [sku_id, store_ids, horizon_weeks]
      properties:
        sku_id: { type: string }
        store_ids: { type: array, items: { type: string } }
        horizon_weeks: { type: integer, minimum: 1, maximum: 26 }
        shocks:
          type: object
          additionalProperties: { type: number }

    ForecastResult:
      type: object
      properties:
        run_id: { type: string }
        model_version: { type: string }
        forecasts:
          type: array
          items:
            type: object
            properties:
              sku_id: { type: string }
              store_id: { type: string }
              week: { type: string, format: date }
              p10: { type: number }
              p50: { type: number }
              p90: { type: number }
        warnings:
          type: array
          items: { type: string }

    ScenarioRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, description: Natural-language scenario }
        context:
          type: object
          properties:
            banners: { type: array, items: { type: string } }
            dmas: { type: array, items: { type: string } }

    ScenarioResult:
      type: object
      properties:
        run_id: { type: string }
        narrative: { type: string, description: Grounded, narrated answer }
        forecast: { $ref: '#/components/schemas/ForecastResult' }
        attribution: { $ref: '#/components/schemas/AttributionResult' }
        citations:
          type: array
          items: { type: string }

    AttributionRequest:
      type: object
      required: [sku_id, delta]
      properties:
        sku_id: { type: string }
        delta: { type: number }
        drivers:
          type: array
          items: { type: string, enum: [glp1, price, mix, distribution, private_label] }

    AttributionResult:
      type: object
      properties:
        run_id: { type: string }
        effects:
          type: array
          items:
            type: object
            properties:
              driver: { type: string }
              effect: { type: number }
              confidence: { type: number }
        sign_consistent: { type: boolean }